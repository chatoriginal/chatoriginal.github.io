<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TerminalChat</title>
<meta name="description" content="TerminalChat — a public, IRC-inspired chat network.">
<meta name="theme-color" content="#131417">
<!-- This page is ONE file (HTML + CSS + JS), so inline script/style must be allowed. Everything else is locked down. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src https: wss: http://localhost:* ws://localhost:* http://127.0.0.1:* ws://127.0.0.1:*; base-uri 'none'; form-action 'none'">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%235b63f0'/%3E%3Cpath d='M9 11l6 5-6 5' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M17 21h6' stroke='white' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{--bg0:#131417;--bg1:#1a1b1f;--bg2:#212227;--bg3:#292b31;--bg4:#32343b;--line:#2f3137;--text:#e7e8ec;--text2:#b4b6bf;--muted:#8b8d97;--accent:#6b74ff;--accent2:#9a6bff;--soft:rgba(107,116,255,.15);--good:#3ecf8e;--warn:#f2b84b;--bad:#ff6270;--r:12px;--font:Inter,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;--mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg0);color:var(--text);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
.hidden{display:none!important}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
code{font-family:var(--mono);font-size:.9em;background:var(--bg3);padding:1px 5px;border-radius:4px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:#8f98ff}
.btn{border:0;border-radius:10px;padding:9px 16px;font-weight:600;background:var(--bg4);transition:background .15s,opacity .15s}
.btn:hover{background:#3b3d45}.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn-primary:hover{background:linear-gradient(135deg,#7a82ff,#a77dff)}
.btn-danger{background:#5b2a31;color:#ffb3ba}.btn-danger:hover{background:#74333b}
.btn-sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn-wide{width:100%}
.input{width:100%;background:var(--bg0);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:0}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
textarea.input{resize:vertical;min-height:70px}
.field{display:block;margin:0 0 12px}.field-label{display:block;font-size:13px;color:var(--text2);margin-bottom:4px}
.hint{color:var(--muted);font-size:12.5px;margin:4px 0 0}
.form-error{color:var(--bad);font-size:13.5px;margin:8px 0}.form-note{color:var(--warn);font-size:13px;margin:8px 0}
.check{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--text2);margin:10px 0}
.version{position:fixed;top:5px;right:10px;font:11px var(--mono);color:var(--muted);opacity:.75;z-index:80;pointer-events:none}
.boot-error{position:fixed;inset:0 0 auto 0;background:#4a1d23;color:#ffd0d5;padding:12px 16px;z-index:90}

/* auth */
.screen{position:fixed;inset:0}
#auth{display:grid;place-items:center;padding:16px;overflow:auto;background:radial-gradient(900px 500px at 20% -10%,rgba(107,116,255,.18),transparent),var(--bg0)}
.card{width:100%;max-width:420px;background:var(--bg1);border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 30px 80px -30px #000}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font:700 14px var(--mono);color:#fff}
.wordmark{font-weight:700;font-size:20px}
.lead{color:var(--text2);margin:2px 0 16px}
.tabs{display:flex;gap:4px;background:var(--bg0);border-radius:10px;padding:4px;margin-bottom:16px}
.tab{flex:1;border:0;background:none;border-radius:7px;padding:8px;color:var(--muted);font-weight:600}
.tab[aria-selected=true]{background:var(--bg3);color:var(--text)}
.linkbtn{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;padding:6px 0}

/* chat layout */
#chat{display:grid;grid-template-columns:250px 1fr 210px}
#chat.no-members{grid-template-columns:250px 1fr}
#chat.no-members .members{display:none}
.side{background:var(--bg1);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-head{padding:14px 16px;font-weight:700;display:flex;gap:8px;align-items:center}
.side-scroll{flex:1;overflow:auto;padding:0 8px}
.sec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 8px 4px;display:flex;justify-content:space-between;align-items:center}
.item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:7px 10px;color:var(--text2)}
.item:hover{background:var(--bg3)}.item.active{background:var(--soft);color:var(--text)}
.item .cnt{margin-left:auto;font-size:12px;color:var(--muted)}
.item .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{margin-left:auto;background:var(--accent);color:#fff;border-radius:9px;font-size:11px;padding:0 6px;font-weight:700}
.me{padding:10px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
.me .who{flex:1;min-width:0}.me .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.me .who small{color:var(--muted)}
.iconbtn{background:none;border:0;border-radius:8px;padding:6px 8px;color:var(--text2);font-size:16px;line-height:1}
.iconbtn:hover{background:var(--bg3);color:var(--text)}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg0)}
.head{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);min-height:52px;padding-right:70px}
.head h2{margin:0;font-size:16px}.head .desc{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;background:rgba(242,184,75,.15);color:var(--warn);white-space:nowrap}
#burger{display:none}
#msgs{flex:1;overflow:auto;padding:8px 0 12px;min-height:0}
.msg{position:relative;padding:3px 16px 3px 16px}
.msg:hover,.msg.show{background:var(--bg1)}
.msg.pinned{border-left:3px solid var(--warn);padding-left:13px}
.msg.mentioned{background:rgba(107,116,255,.08);border-left:3px solid var(--accent);padding-left:13px}
.mh{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.nm{background:none;border:0;padding:0;font-weight:700;color:#aab1ff;cursor:pointer}.nm:hover{text-decoration:underline}
.nm.admin{color:var(--warn)}.nm.system{color:var(--good);cursor:default;text-decoration:none!important}
.colon{margin-left:-4px;font-weight:700;color:var(--muted)}
.tm{font-size:11.5px;color:var(--muted)}
.tag{font-size:10px;font-weight:700;border-radius:4px;padding:0 5px;background:rgba(242,184,75,.18);color:var(--warn)}
.body{word-wrap:break-word;overflow-wrap:anywhere}
.msg.system-msg{background:rgba(62,207,142,.07);border-left:3px solid var(--good);padding-left:13px}
.msg.system-msg .body{font-weight:500}
.sys{padding:2px 16px;font-size:12.5px;color:var(--muted);font-style:italic}.sys.err{color:var(--bad)}.sys.ok{color:var(--good)}
.dsep{text-align:center;color:var(--muted);font-size:12px;margin:10px 0;display:flex;align-items:center;gap:10px;padding:0 16px}
.dsep::before,.dsep::after{content:"";height:1px;background:var(--line);flex:1}
.md-p{white-space:pre-wrap}.md-h{font-weight:700}.md-h1{font-size:1.25em}.md-h2{font-size:1.12em}
.md-quote{border-left:3px solid var(--bg4);padding-left:10px;color:var(--text2);white-space:pre-wrap}
.md-pre{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;overflow:auto;margin:4px 0}.md-pre code{background:none;padding:0}
.md-list{margin:2px 0;padding-left:22px}
.mention{background:var(--soft);color:#b9bfff;border-radius:4px;padding:0 3px;font-weight:600}.mention.mine{background:rgba(242,184,75,.2);color:var(--warn)}
.reply{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:1px;cursor:pointer;overflow:hidden;white-space:nowrap}
.reply::before{content:"↪";color:var(--accent)}.reply b{color:var(--text2)}.reply span{overflow:hidden;text-overflow:ellipsis}
.edited{font-size:11px;color:var(--muted)}
.reacts{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.rx{border:1px solid var(--line);background:var(--bg2);border-radius:99px;padding:0 8px;font-size:13px;line-height:22px}
.rx.mine{border-color:var(--accent);background:var(--soft)}
.tools{position:absolute;right:12px;top:-14px;display:none;background:var(--bg3);border:1px solid var(--line);border-radius:9px;padding:2px;z-index:5}
.msg:hover .tools,.msg.show .tools{display:flex}
.tools button{background:none;border:0;border-radius:6px;padding:3px 7px;font-size:14px}.tools button:hover{background:var(--bg4)}
.att img{max-width:min(360px,100%);max-height:300px;border-radius:8px;display:block;margin-top:4px;background:var(--bg2)}
.file{display:inline-flex;gap:8px;align-items:center;margin-top:4px;padding:8px 12px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--text)}
.file small{color:var(--muted)}
.more{display:block;margin:6px auto;}
.edit-box{width:100%}
.foot{padding:0 16px 14px}
#typing{height:20px;font-size:12.5px;color:var(--muted);font-style:italic;padding:0 2px}
.bar{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;padding:6px 10px;font-size:13px;color:var(--text2)}
.bar span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.composer{display:flex;gap:8px;align-items:flex-end;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:6px}
.composer.joined{border-radius:0 0 12px 12px}
.composer textarea{flex:1;background:none;border:0;outline:0;resize:none;max-height:160px;padding:6px 8px;line-height:1.4}
.members{background:var(--bg1);border-left:1px solid var(--line);overflow:auto;padding:8px}
.members .item{padding:5px 8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px;z-index:60;overflow:auto}
.modal{width:100%;max-width:460px;background:var(--bg1);border:1px solid var(--line);border-radius:16px;padding:20px;max-height:92vh;overflow:auto}
.modal h3{margin:0 0 10px}.modal .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.bio{background:var(--bg0);border:1px solid var(--line);border-radius:10px;padding:10px;white-space:pre-wrap;color:var(--text2);min-height:44px}
.pop{position:fixed;z-index:70;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px;width:300px;box-shadow:0 16px 40px -10px #000}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;margin-bottom:6px}
.emojis button{background:none;border:0;border-radius:6px;font-size:20px;padding:3px}.emojis button:hover{background:var(--bg4)}
#toasts{position:fixed;right:14px;bottom:84px;display:flex;flex-direction:column;gap:8px;z-index:100;max-width:min(360px,calc(100vw - 28px))}
.toast{background:var(--bg3);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:10px 12px;box-shadow:0 12px 30px -10px #000;cursor:pointer;font-size:14px}
.toast b{display:block}.toast span{color:var(--text2);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast.warn{border-left-color:var(--warn)}.toast.good{border-left-color:var(--good)}
.banner{background:#463a16;color:#ffe3a0;text-align:center;font-size:13px;padding:4px}
.pin-item{border-bottom:1px solid var(--line);padding:8px 0}.pin-item small{color:var(--muted)}
@media(max-width:820px){
 #chat,#chat.no-members{grid-template-columns:1fr}
 .side{position:fixed;inset:0 auto 0 0;width:270px;z-index:50;transform:translateX(-100%);transition:transform .2s}
 #chat.nav-open .side{transform:none}
 #burger{display:inline-block}
 .members{display:none}
 .tools{top:-16px}
}
</style>
</head>
<body>
<div id="boot-error" class="boot-error hidden" role="alert"></div>
<span class="version" id="version" title="TerminalChat version"></span>
<div id="toasts" aria-live="polite"></div>

<!-- ================= SIGN-IN SCREEN ================= -->
<div id="auth" class="screen hidden">
  <div class="card">
    <div class="brand"><span class="logo">&gt;_</span><span class="wordmark">TerminalChat</span></div>
    <p class="lead">A public chat in the spirit of old-school IRC.</p>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="login" aria-selected="true">Log in</button>
      <button class="tab" role="tab" data-tab="signup" aria-selected="false">Sign up</button>
      <button class="tab" role="tab" data-tab="guest" aria-selected="false">Guest</button>
    </div>

    <form id="f-login" data-form="login" novalidate>
      <label class="field"><span class="field-label">Username</span><input class="input" name="username" maxlength="20" autocomplete="username" autocapitalize="none" spellcheck="false" data-nospace></label>
      <label class="field"><span class="field-label">Password</span><input class="input" name="password" type="password" maxlength="72" autocomplete="current-password"></label>
      <button class="btn btn-primary btn-wide" type="submit">Log in</button>
    </form>

    <form id="f-signup" data-form="signup" class="hidden" novalidate>
      <label class="field"><span class="field-label">Username (for logging in)</span><input class="input" name="username" maxlength="20" autocomplete="username" autocapitalize="none" spellcheck="false" data-nospace>
        <p class="hint">3–20 characters, no spaces. Letters, numbers, <code>_</code> and <code>-</code>.</p></label>
      <label class="field"><span class="field-label">Display name (shown in chat)</span><input class="input" name="displayName" maxlength="24" autocomplete="nickname"><p class="hint">Spaces are fine here. You can change it later.</p></label>
      <label class="field"><span class="field-label">Password</span><input class="input" name="password" type="password" maxlength="72" autocomplete="new-password"><p class="hint">At least 8 characters.</p></label>
      <button class="btn btn-primary btn-wide" type="submit">Create account</button>
    </form>

    <form id="f-guest" data-form="guest" class="hidden" novalidate>
      <label class="field"><span class="field-label">Pick any username</span><input class="input" name="username" maxlength="20" autocapitalize="none" spellcheck="false" data-nospace>
        <p class="hint">Guests can only use <b>#general</b> and cannot send or receive private messages.</p></label>
      <button class="btn btn-primary btn-wide" type="submit">Continue as guest</button>
    </form>

    <form id="f-admin" data-form="admin" class="hidden" novalidate>
      <label class="field"><span class="field-label">Administrator username</span><input class="input" name="username" maxlength="20" autocomplete="username" data-nospace></label>
      <label class="field"><span class="field-label">Administrator password</span><input class="input" name="password" type="password" maxlength="200" autocomplete="current-password"></label>
      <button class="btn btn-primary btn-wide" type="submit">Log in as administrator</button>
    </form>

    <p id="auth-error" class="form-error hidden" role="alert"></p>
    <p id="auth-note" class="form-note hidden"></p>
    <label class="check"><input type="checkbox" id="remember" checked> Keep me signed in on this device (stores a login token in this browser)</label>
    <button class="linkbtn" id="toggle-admin" type="button">Administrator login</button>
  </div>
</div>

<!-- ================= CHAT ================= -->
<div id="chat" class="screen hidden">
  <aside class="side">
    <div class="side-head"><span class="logo" style="width:26px;height:26px;font-size:11px">&gt;_</span> TerminalChat</div>
    <div class="side-scroll">
      <div class="sec"><span>Rooms</span><span id="online-count"></span></div>
      <div id="room-list"></div>
      <div id="dm-section">
        <div class="sec"><span>Direct messages</span><button class="iconbtn" id="new-dm" title="New message" style="padding:0 6px">＋</button></div>
        <div id="dm-list"></div>
      </div>
      <p id="guest-hint" class="hint hidden" style="padding:8px">Create a free account to unlock private messages and more rooms.</p>
    </div>
    <div class="me">
      <div class="who"><b id="me-name"></b><small id="me-role"></small></div>
      <button class="iconbtn hidden" id="btn-admin" title="Admin panel">🛡</button>
      <button class="iconbtn" id="btn-settings" title="Settings">⚙</button>
    </div>
  </aside>

  <section class="main">
    <div id="conn-banner" class="banner hidden">Reconnecting…</div>
    <div class="head">
      <button class="iconbtn" id="burger" aria-label="Menu">☰</button>
      <h2 id="title"></h2><span class="desc" id="desc"></span>
      <span class="pill hidden" id="slow"></span>
      <button class="iconbtn" id="btn-pins" title="Pinned messages">📌</button>
    </div>
    <div id="msgs"></div>
    <div class="foot">
      <div id="typing"></div>
      <div id="reply-bar" class="bar hidden"><span id="reply-text"></span><button class="iconbtn" id="reply-x" title="Cancel reply">✕</button></div>
      <div id="attach-bar" class="bar hidden"><span id="attach-text"></span><button class="iconbtn" id="attach-x" title="Remove file">✕</button></div>
      <div class="composer" id="composer">
        <button class="iconbtn" id="btn-attach" title="Attach an image or file">📎</button>
        <input type="file" id="file-input" class="hidden">
        <textarea id="input" rows="1" placeholder="Message… (Enter to send, Shift+Enter for a new line)"></textarea>
        <button class="btn btn-primary" id="btn-send">Send</button>
      </div>
    </div>
  </section>

  <aside class="members" id="members-panel"><div class="sec"><span>In this room</span></div><div id="member-list"></div></aside>
</div>

<div id="modal-host"></div>

<script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.8.1/dist/socket.io.min.js"></script>
<script>
'use strict';
/* =====================================================================
   SETTINGS — the only two lines you normally need to edit
   ===================================================================== */
const APP_VERSION = '1.0.0';                       // MAJOR.MINOR.PATCH — change this line to release a new version
const PRODUCTION_BACKEND = 'https://terminalchat-gsel.onrender.com'; // your Render URL, no trailing slash
const BACKEND_URL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? 'http://localhost:3000' : PRODUCTION_BACKEND;

/* =====================================================================
   Safe Markdown → DOM (never innerHTML; images and raw HTML are not supported)
   **bold** *italic* ~~strike~~ `code` ```blocks``` [text](https://…) > quote - list # heading @mentions
   ===================================================================== */
const TCMarkdown = (() => {
  const MAX_DEPTH = 4;
  const make = (t, c) => { const n = document.createElement(t); if (c) n.className = c; return n; };
  const safeUrl = (raw) => { try { const u = new URL(raw); return u.protocol === 'http:' || u.protocol === 'https:' ? u.href : null; } catch { return null; } };
  const linkNode = (href, label) => { const a = make('a'); a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer nofollow'; a.textContent = label; return a; };
  const wrap = (tag, depth) => (inner) => { const n = make(tag); parseInline(inner, n, depth + 1); return n; };
  let myNames = new Set();
  const RULES = [
    (rest) => { const m = /`([^`\n]+)`/.exec(rest); if (!m) return null; const n = make('code'); n.textContent = m[1]; return { start: m.index, end: m.index + m[0].length, node: n }; },
    (rest) => { const m = /\[([^\]\n]{1,200})\]\((https?:\/\/[^\s)]{1,500})\)/.exec(rest); if (!m) return null; const h = safeUrl(m[2]); return { start: m.index, end: m.index + m[0].length, node: h ? linkNode(h, m[1]) : document.createTextNode(m[0]) }; },
    (rest) => { const m = /https?:\/\/[^\s<>"']+/.exec(rest); if (!m) return null; let u = m[0]; while (/[.,!?;:)\]*_~]$/.test(u)) u = u.slice(0, -1); const h = safeUrl(u); return { start: m.index, end: m.index + u.length, node: h ? linkNode(h, u) : document.createTextNode(u) }; },
    (rest) => { const m = /(^|[^\w@])@([A-Za-z][A-Za-z0-9_-]{1,23})/.exec(rest); if (!m) return null; const n = make('span', 'mention' + (myNames.has(m[2].toLowerCase()) ? ' mine' : '')); n.textContent = '@' + m[2]; const s = m.index + m[1].length; return { start: s, end: m.index + m[0].length, node: n }; },
    (rest, d) => { const m = /\*\*([^\s*](?:[^*]*[^\s*])?)\*\*/.exec(rest); return m ? { start: m.index, end: m.index + m[0].length, node: wrap('strong', d)(m[1]) } : null; },
    (rest, d) => { const m = /(^|[^\w])__([^\s_](?:[^_]*[^\s_])?)__(?!\w)/.exec(rest); if (!m) return null; return { start: m.index + m[1].length, end: m.index + m[0].length, node: wrap('strong', d)(m[2]) }; },

const $ = (s, r = document) => r.querySelector(s);

const fmtTime = (iso) => new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const fmtDay = (iso) => new Date(iso).toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });

/* Storage: the login token is kept in localStorage if "keep me signed in" is ticked, else only for this tab. */
const KEY = 'tc_auth';
const store = {
  read() { for (const s of [localStorage, sessionStorage]) { try { const v = s.getItem(KEY); if (v) return JSON.parse(v); } catch { /* ignore */ } } return null; },
  write(obj, remember) { this.clear(); try { (remember ? localStorage : sessionStorage).setItem(KEY, JSON.stringify(obj)); } catch { /* ignore */ } },
  clear() { for (const s of [localStorage, sessionStorage]) { try { s.removeItem(KEY); } catch { /* ignore */ } } },

const S = {

let socket = null;

function emit(event, payload) {
  return new Promise((resolve) => {
    if (!socket || !socket.connected) return resolve({ ok: false, error: 'Not connected to the server.' });
    const t = setTimeout(() => resolve({ ok: false, error: 'The server took too long to answer.' }), 20000);
    socket.emit(event, payload, (res) => { clearTimeout(t); resolve(res || { ok: false, error: 'No response.' }); });
  });
}

function toast(title, text, kind, onclick) {

  $('#toasts').append(t);
  setTimeout(() => t.remove(), 7000);
  while ($('#toasts').children.length > 4) $('#toasts').firstChild.remove();
}

function showAuth(error) {

function setAuthMsg(err, note) {

function selectTab(name) {
  document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-selected', String(t.dataset.tab === name)));
  document.querySelectorAll('#auth form').forEach((f) => f.classList.toggle('hidden', f.dataset.form !== name));

}
document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => selectTab(t.dataset.tab)));
$('#toggle-admin').addEventListener('click', () => {

// usernames can never contain spaces: strip them as people type or paste
document.querySelectorAll('[data-nospace]').forEach((i) => i.addEventListener('input', () => { const v = i.value.replace(/\s+/g, ''); if (v !== i.value) i.value = v; }));

document.querySelectorAll('#auth form').forEach((form) => form.addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const kind = form.dataset.form;
  const f = Object.fromEntries(new FormData(form).entries());
  const btn = $('button[type=submit]', form);
  setAuthMsg('', socket && socket.connected ? '' : 'Connecting… the server may take up to a minute to wake up.');
  btn.disabled = true;
  try {
    const remember = $('#remember').checked;
    const [event, payload] = {
      login: ['auth:login', { username: f.username, password: f.password }],
      signup: ['auth:signup', { username: f.username, displayName: f.displayName, password: f.password }],
      guest: ['guest:start', { username: f.username, resumeToken: (store.read() || {}).resumeToken }],
      admin: ['admin:login', { username: f.username, password: f.password }],
    }[kind];
    if (!socket.connected) await waitConnected(70000);
    const r = await emit(event, payload);
    if (!r.ok) return setAuthMsg(r.error || 'Something went wrong.', '');

function waitConnected(ms) {

}
function saveAuth(r, remember) {

  else if (r.role === 'member') rec = { kind: 'member', token: r.authToken };
  else rec = { kind: 'guest', username: r.username, resumeToken: r.resumeToken };

function applySession(r) {
  S.me = { username: r.username, displayName: r.displayName, bio: r.bio || '', role: r.role, isAdmin: !!r.isAdmin };
  S.rooms = r.rooms || []; S.dms = r.dms || []; S.online = r.online || 0; S.maxLen = r.maxMessageLength || 1000; S.maxUpload = r.maxUploadBytes || 0;
  TCMarkdown.setMyNames([S.me.username, S.me.displayName.split(' ')[0]]);
  $('#me-name').textContent = S.me.displayName;
  $('#me-role').textContent = S.me.isAdmin ? 'Administrator' : S.me.role === 'guest' ? 'Guest' : '@' + S.me.username;
  $('#btn-admin').classList.toggle('hidden', !S.me.isAdmin);
  const guest = S.me.role === 'guest';
  $('#dm-section').classList.toggle('hidden', guest);
  $('#guest-hint').classList.toggle('hidden', !guest);
  $('#input').maxLength = S.maxLen;
  $('#btn-attach').classList.toggle('hidden', !S.maxUpload);
  renderRooms(); renderDms();
}

async function enterChat(r) {
  applySession(r);
  $('#auth').classList.add('hidden');
  $('#chat').classList.remove('hidden');
  const prev = S.view;
  if (prev && prev.type === 'dm' && S.me.role !== 'guest') return openDm(prev.with);
  const want = (prev && prev.type === 'room' && S.rooms.find((x) => x.id === prev.id)) ||
    S.rooms.find((x) => x.name === 'general') || S.rooms[0];
  if (want) await joinRoom(want.id); else { S.view = null; $('#title').textContent = 'No rooms'; }
  if ('Notification' in window && Notification.permission === 'default' && !sessionStorage.getItem('tc_asked_notif')) {
    sessionStorage.setItem('tc_asked_notif', '1');
    toast('Enable notifications?', 'Click here to get alerts for @mentions, replies and DMs.', 'good', askNotifications);
  }
}

function askNotifications() {
  if (!('Notification' in window)) return toast('Not supported', 'This browser does not support notifications.', 'warn');
  Notification.requestPermission().then((p) => toast(p === 'granted' ? 'Notifications on' : 'Notifications blocked', p === 'granted' ? 'You will be alerted for mentions, replies and DMs.' : 'Allow them in your browser\'s site settings to turn them on.', p === 'granted' ? 'good' : 'warn'));
}

async function logout() {
  await emit('session:end', {});
  store.clear(); S.me = null; S.view = null; S.msgs.clear();
  $('#msgs').replaceChildren();
  showAuth('');
  selectTab('login');
}

function appendMessage(m) {

  const prev = lastEl && S.msgs.get(Number(lastEl.dataset.id));
  const sep = daySep(prev && prev.msg.createdAt, m.createdAt);

const input = $('#input');
function autosize() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 160) + 'px'; }
let lastTypingSent = 0;
input.addEventListener('input', () => {
  autosize();
  if (!S.view || !input.value.trim() || input.value.trim()[0] === '.' || input.value.trim()[0] === '/') return;
  const now = Date.now();
  if (now - lastTypingSent > 3000) { lastTypingSent = now; emit('typing', S.view.type === 'room' ? { scope: 'room' } : { scope: 'dm', to: S.view.with }); }
});
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
  else if (e.key === 'Escape' && S.replyTo) { S.replyTo = null; updateBars(); }
});
$('#btn-send').addEventListener('click', send);

let sending = false;
async function send() {
  if (sending || !S.view) return;
  const text = input.value.replace(/\s+$/, '');
  if (!text && !S.attach) return;
  sending = true; $('#btn-send').disabled = true;
  try {
    if (S.attach) {
      const ok = await uploadFile(text);
      if (ok) { input.value = ''; autosize(); S.attach = null; S.replyTo = null; $('#file-input').value = ''; updateBars(); }
      return;
    }
    const r = S.view.type === 'room'
      ? await emit('message:send', { content: text, replyTo: S.replyTo ? S.replyTo.id : undefined })
      : await emit('dm:send', { to: S.view.with, content: text, replyTo: S.replyTo ? S.replyTo.id : undefined });
    if (!r.ok) return sysLine(r.error, 'err');
    input.value = ''; autosize(); S.replyTo = null; updateBars();
    if (r.command && r.info) sysLine(r.info, 'ok');
  } finally { sending = false; $('#btn-send').disabled = false; input.focus(); }
}

async function uploadFile(caption) {
  const f = S.attach;
  const body = { name: f.name, size: f.size, caption, replyTo: S.replyTo ? S.replyTo.id : undefined };
  if (S.view.type === 'dm') body.to = S.view.with;
  const t = await emit('upload:ticket', body);
  if (!t.ok) { sysLine(t.error, 'err'); return false; }
  $('#attach-text').textContent = `⏳ Uploading ${f.name}…`;
  return new Promise((resolve) => {
    const x = new XMLHttpRequest();
    x.open('POST', BACKEND_URL + '/upload');
    x.setRequestHeader('X-Upload-Ticket', t.ticket);
    x.setRequestHeader('Content-Type', 'application/octet-stream');
    x.upload.onprogress = (e) => { if (e.lengthComputable) $('#attach-text').textContent = `⏳ Uploading ${f.name}… ${Math.round((e.loaded / e.total) * 100)}%`; };
    x.onload = () => {
      let res = {}; try { res = JSON.parse(x.responseText); } catch { /* ignore */ }
      if (x.status >= 200 && x.status < 300 && res.ok) return resolve(true);
      sysLine(res.error || 'The upload failed.', 'err'); updateBars(); resolve(false);
    };
    x.onerror = () => { sysLine('The upload failed (network error).', 'err'); updateBars(); resolve(false); };
    x.send(f);
  });
}

/* =====================================================================
   Notifications
   ===================================================================== */
function windowFocused() { return document.hasFocus() && !document.hidden; }
function notifyText(n) {
  if (n.kind === 'dm') return [`${n.from} sent you a message`, n.snippet];
  if (n.kind === 'mention') return [`${n.from} mentioned you in #${n.roomName}`, n.snippet];
  if (n.kind === 'reply') return [`${n.from} replied to you in #${n.roomName}`, n.snippet];
  if (n.kind === 'announce') return ['📣 System Message', n.text];
  return ['TerminalChat', n.text || ''];
}
function onNotify(n) {
  if (!S.me) return;
  const viewingIt = n.scope === 'dm' && S.view && S.view.type === 'dm' && S.view.with.toLowerCase() === (n.fromUsername || '').toLowerCase();
  const [title, text] = notifyText(n);
  const go = () => {
    window.focus();
    if (n.scope === 'dm') openDm(n.fromUsername);
    else if (n.scope === 'room' && n.roomId && !(S.view && S.view.type === 'room' && S.view.id === n.roomId)) joinRoom(n.roomId);
  };
  if (!(viewingIt && windowFocused())) toast(title, text, n.kind === 'muted' ? 'warn' : n.kind === 'announce' ? 'warn' : '', go);
  if (n.kind === 'dm' && !viewingIt) {
    const t = S.dms.find((d) => d.with.toLowerCase() === n.fromUsername.toLowerCase());
    if (t) t.unread = true; else S.dms.unshift({ with: n.fromUsername, displayName: n.from, unread: true });
    renderDms();
  }
  if (!windowFocused() && 'Notification' in window && Notification.permission === 'granted') {
    try { const x = new Notification(title, { body: text, tag: 'tc-' + (n.messageId || n.ts) }); x.onclick = () => { go(); x.close(); }; } catch { /* some browsers need a service worker */ }
  }
  if (!windowFocused()) { S.unreadTotal += 1; updateTitleCount(); }
}
window.addEventListener('focus', () => { S.unreadTotal = 0; updateTitleCount(); });

/* =====================================================================
   Socket events
   ===================================================================== */
function bindSocket() {
  socket.on('connect', async () => {
    $('#conn-banner').classList.add('hidden');
    const a = store.read();
    if (!a) { if (!S.me) showAuth(''); return; }
    S.resuming = true;
    let r;
    if (a.kind === 'member') r = await emit('auth:resume', { token: a.token });
    else if (a.kind === 'admin') r = await emit('admin:resume', { token: a.token });
    else r = await emit('guest:start', { username: a.username, resumeToken: a.resumeToken });
    S.resuming = false;
    if (!r.ok) { if (!S.me) { store.clear(); showAuth(r.error || ''); } else { S.me = null; store.clear(); showAuth('Your session ended: ' + (r.error || '')); } return; }
    saveAuth(r);
    await enterChat(r);
  });
  socket.on('disconnect', () => { if (S.me) $('#conn-banner').classList.remove('hidden'); });
  socket.on('connect_error', (e) => { if (!S.me) setAuthMsg('', 'Connecting… the server may take up to a minute to wake up. (' + (e && e.message || 'waiting') + ')'); });

  socket.on('rooms:list', ({ rooms, online }) => { S.rooms = rooms; S.online = online; renderRooms(); });
  socket.on('room:users', ({ roomId, users }) => { if (S.view && S.view.type === 'room' && S.view.id === roomId) { S.users = users; renderUsers(); } });
  socket.on('room:slowmode', ({ roomId, seconds }) => { if (S.view && S.view.id === roomId) { S.slow = seconds; renderSlow(); } });
  socket.on('system:event', (e) => { if (S.view && S.view.type === 'room' && S.view.id === e.roomId) sysLine(e.text); });
  socket.on('room:deleted', ({ roomId, name }) => {
    S.rooms = S.rooms.filter((r) => r.id !== roomId);
    if (S.view && S.view.id === roomId) { toast('Room deleted', `#${name} was deleted.`, 'warn'); const g = S.rooms.find((r) => r.name === 'general') || S.rooms[0]; if (g) joinRoom(g.id); }
    renderRooms();
  });

  socket.on('message:new', (m) => {
    if (!inCurrent(m)) return;
    const stick = nearBottom();
    appendMessage(m);
    if (stick || m.username.toLowerCase() === S.me.username.toLowerCase()) scrollDown(true);
    if (m.scope === 'dm' && m.username.toLowerCase() !== S.me.username.toLowerCase()) emit('dm:read', { with: S.view.with });
    if (m.scope === 'dm') S.typing.delete('dm:' + m.username.toLowerCase());
  });
  socket.on('message:updated', (m) => { if (inCurrent(m)) replaceMessage(m); });
  socket.on('message:deleted', (p) => {
    if (!forCurrentScope(p)) return;
    const cur = S.msgs.get(p.id); if (cur) { cur.el.remove(); S.msgs.delete(p.id); }
    S.pins = S.pins.filter((x) => x.id !== p.id);
  });
  socket.on('messages:deleted', ({ roomId, ids }) => {
    if (!(S.view && S.view.id === roomId)) return;
    for (const id of ids) { const cur = S.msgs.get(id); if (cur) { cur.el.remove(); S.msgs.delete(id); } }
    S.pins = S.pins.filter((x) => !ids.includes(x.id));
    sysLine(`${ids.length} message${ids.length === 1 ? '' : 's'} removed by a moderator.`);
  });
  socket.on('message:reactions', (p) => {
    if (!forCurrentScope(p)) return;
    const cur = S.msgs.get(p.id); if (!cur) return;
    cur.msg.reactions = p.reactions; replaceMessage(cur.msg);
  });
  socket.on('message:pinned', ({ roomId, message }) => {
    if (!(S.view && S.view.id === roomId)) return;
    S.pins = S.pins.filter((x) => x.id !== message.id);
    if (message.pinned) S.pins.push(message);
    const cur = S.msgs.get(message.id);
    if (cur) { cur.msg.pinned = message.pinned; replaceMessage(cur.msg); }
    sysLine(`${message.displayName}'s message was ${message.pinned ? 'pinned' : 'unpinned'}.`);
  });
  socket.on('room:pruned', ({ roomId, beforeId }) => {
    if (!(S.view && S.view.id === roomId)) return;
    for (const [id, cur] of S.msgs) if (id < beforeId && !cur.msg.pinned) { cur.el.remove(); S.msgs.delete(id); }
  });
  socket.on('typing:update', (t) => {
    if (t.scope === 'room') { if (S.view && S.view.id === t.roomId) { if (t.count) S.typing.set('room', { count: t.count, names: t.names, exp: Date.now() + 6000 }); else S.typing.delete('room'); renderTyping(); } }
    else S.typing.set('dm:' + t.with.toLowerCase(), { name: t.displayName, exp: Date.now() + 5000 });
    renderTyping();
  });
  socket.on('profile:updated', ({ username, displayName, bio }) => {
    document.querySelectorAll(`.nm[data-user="${CSS.escape(username)}"]`).forEach((e) => { e.textContent = displayName; });
    if (S.me && username.toLowerCase() === S.me.username.toLowerCase()) { S.me.displayName = displayName; S.me.bio = bio; $('#me-name').textContent = displayName; }
    for (const d of S.dms) if (d.with.toLowerCase() === username.toLowerCase()) d.displayName = displayName;
    renderDms();
  });
  socket.on('notify', onNotify);
  const forced = (msg) => { store.clear(); S.me = null; S.view = null; $('#msgs').replaceChildren(); showAuth(msg); };
  socket.on('kicked', ({ reason }) => forced('You were kicked by a moderator.' + (reason ? ' Reason: ' + reason : '')));
  socket.on('banned', ({ reason }) => forced('You were banned.' + (reason ? ' Reason: ' + reason : '')));
  socket.on('session:replaced', ({ message }) => forced(message));
}

/* =====================================================================
   Boot
   ===================================================================== */
function boot() {
  $('#version').textContent = APP_VERSION;
  if (typeof io === 'undefined') {
    const e = $('#boot-error'); e.textContent = 'Could not load the chat library (socket.io). Check your internet connection and reload.'; e.classList.remove('hidden');
    return;
  }
  socket = io(BACKEND_URL, { transports: ['websocket', 'polling'], reconnectionDelayMax: 5000 });
  bindSocket();
  // With a saved login we wait for the automatic resume; otherwise show the sign-in screen right away.
  if (!store.read()) showAuth('');
}
boot();
</script>
